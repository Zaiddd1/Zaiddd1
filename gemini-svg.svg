<svg width="600" height="250" viewBox="0 0 600 250" style="background-color:#010409; border-radius: 12px; border: 1px solid #30363d;">
  <!-- Estilos CSS integrados para animaciones nativas -->
  

  <!-- Botones estilo ventana de macOS -->
  <circle cx="20" cy="20" r="5" fill="#ff5f56" />
  <circle cx="36" cy="20" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="20" r="5" fill="#27c93f" />
  
  <!-- Título de la ventana -->
  <text x="300" y="24" text-anchor="middle" fill="#58a6ff" font-family="monospace" font-size="14">
    ZAIDDD1 // PROFILE DASHBOARD V9.1
  </text>

  <!-- Marco del retrato (Izquierda) -->
  <rect x="20" y="40" width="180" height="200" rx="4" fill="none" stroke="#21262d" stroke-width="2" />
  <polyline points="25,45 25,55 35,45" fill="#30363d" />
  <polyline points="195,45 195,55 185,45" fill="#30363d" />
  <polyline points="25,235 25,225 35,235" fill="#30363d" />
  <polyline points="195,235 195,225 185,235" fill="#30363d" />

  <!-- Retrato en semitono animado (Placeholder - un desarrollador) -->
  <g class="halftone-image">
    <!-- Simulación de pulso de semitono (cambio leve de opacidad) -->
    <animate values="0.9;1;0.9" dur="4s" />
    
    <!-- Retrato (Placeholder) -->
    <text x="110" y="140" text-anchor="middle" fill="#f06292" font-family="serif" font-size="60">[ ]</text>
    <text x="110" y="160" text-anchor="middle" fill="#f06292" font-family="monospace" font-size="12">[D_EV]</text>
  </g>

  <!-- Terminal de comandos (Derecha) -->
  <rect x="210" y="40" width="370" height="200" rx="4" fill="none" stroke="#21262d" stroke-width="2" />

  <!-- Texto de la terminal con animación SMIL (Efecto de escritura) -->
  <g class="typing">
    <!-- Línea 1 -->
    <text x="220" y="65" class="text-pink">zaiddd1@profile:~/$</text>
    
    <!-- Línea 2: fetch status... -->
    <text x="220" y="85" class="text-white">
      <animate dur="0.5s" />
      fetch status...
    </text>
    
    <!-- Línea 3: Status: ONLINE -->
    <text x="220" y="105" class="text-green">
      <animate dur="0.5s" />
      Status: ONLINE
      <!-- Pulso de color verde -->
      <animate values="#27c93f;#ffeb3b;#27c93f" dur="2s" />
    </text>
    
    <!-- Línea 4: System: Core Modules Active -->
    <text x="220" y="125" class="text-white">
      <animate dur="0.5s" />
      System: Core Modules Active
    </text>

    <!-- Línea 5: Último Commit -->
    <text x="220" y="145" class="text-white">
      <animate dur="0.5s" />
      Latest Commit: "Optimized SVG animations"
    </text>

    <!-- Cursor intermitente rosado -->
    <rect x="525" y="130" width="8" height="18" fill="#f06292">
      <animate dur="0.5s" />
      <animate values="1;0;1" dur="1s" />
    </rect>
  </g>

  <!-- Indicador de estado rosado "LIVE" -->
  <g>
    <rect x="220" y="215" width="90" height="20" rx="10" fill="#f06292" opacity="0.1">
      <!-- Pulso de aura rosada -->
      <animate values="0.1;0.2;0.1" dur="3s" />
    </rect>
    <text x="265" y="228" text-anchor="middle" fill="#f06292" font-family="monospace" font-size="10">ZAIDDD1: LIVE</text>
  </g>

  <!-- Enlace final -->
  <text x="575" y="235" text-anchor="end" class="text-pink typing" font-size="11" opacity="0.6">
    <animate dur="0.5s" />
    // github.com/zaiddd1
  </text>
</svg>